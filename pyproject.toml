[project]
name = "fsoc-tracker"
version = "0.1.0"
description = "AI-based virtual camera tracking system for coarse alignment of mobile FSOC terminals (SIH26169)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "scipy>=1.12",
    "PyYAML>=6.0",
    "matplotlib>=3.8",
    "PyQt6>=6.6",
    "pyqtgraph>=0.13",
    "onnxruntime>=1.17",
]

[project.optional-dependencies]
train = ["torch>=2.2", "onnx>=1.15"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "pyinstaller>=6.5"]

[project.scripts]
fsoc-tracker = "fsoc_tracker.cli:main"
fsoc-tracker-gui = "fsoc_tracker.gui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fsoc_tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
