# Builds the Windows and Linux desktop archives, runs the test suite and a smoke test of the
# packaged executable and of the web app on each one, then publishes. The two macOS archives are
# built on the team's Apple silicon Mac with tools/build_macos.sh (a macOS runner minute costs ten
# Linux minutes; the free allowance was exhausted on 2026-09-23). Then it publishes:
#   GitHub Releases   the four archives. A push to main updates the rolling "latest" pre-release;
#                     a tag v* (git tag v1.0.0 && git push origin v1.0.0) makes a versioned release.
#   GitHub Packages   ghcr.io/<owner>/argus-desktop  the four archives (oras pull ...)
#                     ghcr.io/<owner>/argus-web      the web app as a Docker image (amd64, arm64)
#                     tags: latest and sha-<commit> from main; <version> and stable from a tag.
# Nothing is published unless every platform build, test and package check passed.
#   Triggers: manually (Actions > Build desktop application > Run workflow) or a tag v*. Not on
#   every push: each run spends Actions minutes, so a build is a decision.
#   Fetch the archives for the project site with:  bash webapp/fetch_builds.sh
name: Build desktop application
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:                      # a newer push to main supersedes a build still running; tags are never cancelled
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            archive: zip
          - os: ubuntu-22.04        # oldest glibc still common on government desktops (Ubuntu 22.04, Debian 12, BOSS)
            label: linux-x64
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux libraries needed by Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xkb1 libxcb-image0 libxcb-render-util0 libxcb-randr0 libdbus-1-3
      - name: Install
        shell: bash
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -e ".[dev,web]"
      - name: Tests
        shell: bash
        run: python -m pytest -q
      - name: PS audit (every row, shall item, deliverable and benchmark of 26169.pdf, measured)
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/ps_audit.py --out out/PS_AUDIT.md
      - name: Web app smoke test
        shell: bash
        run: python webapp/smoke.py
      - name: Package
        shell: bash
        run: python -m PyInstaller --noconfirm --clean fsoc_tracker.spec
      - name: Packaged executable smoke test
        shell: bash
        run: |
          cd dist/ARGUS
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=./ARGUS-cli.exe; else EXE=./ARGUS; fi
          $EXE run -s configs/scenarios/clear_line.yaml --duration 2 --seed 0 --out results/smoke
          ls results/smoke/FSOC_*_report.pdf results/smoke/FSOC_*_frames.csv
          rm -rf results configs models docs      # the launcher recreates these next to the executable on first start
      - name: Archive
        shell: bash
        run: |
          mkdir -p out
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            if [ "$RUNNER_OS" = "Windows" ]; then 7z a -tzip -r "../out/ARGUS-${{ matrix.label }}.zip" ARGUS > /dev/null
            else zip -qry "../out/ARGUS-${{ matrix.label }}.zip" ARGUS; fi
          else
            tar -czf "../out/ARGUS-${{ matrix.label }}.tar.gz" ARGUS
          fi
          ls -l ../out
      - name: Package check (extract the archive as a user would; scenarios, video mode, GUI start)
        shell: bash
        run: python tests/package_check.py out/ARGUS-${{ matrix.label }}.${{ matrix.archive }}
      - uses: actions/upload-artifact@v4
        with:
          name: ARGUS-${{ matrix.label }}
          path: out/*
          retention-days: 90

  # which names this build is published under: a tag gives a version, main gives "latest"
  meta:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.m.outputs.kind }}
      version: ${{ steps.m.outputs.version }}
      tags: ${{ steps.m.outputs.tags }}
      owner: ${{ steps.m.outputs.owner }}
    steps:
      - id: m
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"          # registry names must be lower case
          short="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            kind=release; version="${GITHUB_REF_NAME}"; tags="${version},stable"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            kind=latest; version="main-${short}"; tags="latest,sha-${short}"
          else
            kind=none; version="${GITHUB_REF_NAME}-${short}"; tags=""
          fi
          { echo "kind=$kind"; echo "version=$version"; echo "tags=$tags"; echo "owner=$owner"; } >> "$GITHUB_OUTPUT"
          echo "publishing as: $kind $version ($tags)"

  # the two GitHub-built archives as a GitHub release and as a package on ghcr.io (the macOS
  # archives are built locally and published on the project site by tools/build_macos.sh)
  publish-desktop:
    needs: [build, meta]
    if: needs.meta.outputs.kind != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: write               # create or replace the release
      packages: write               # push to ghcr.io
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KIND: ${{ needs.meta.outputs.kind }}
      VERSION: ${{ needs.meta.outputs.version }}
      TAGS: ${{ needs.meta.outputs.tags }}
      PKG: ghcr.io/${{ needs.meta.outputs.owner }}/argus-desktop
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ARGUS-*
          path: out
          merge-multiple: true
      - name: Check both archives are present
        run: |
          ls -l out
          for f in ARGUS-windows-x64.zip ARGUS-linux-x64.tar.gz; do
            test -s "out/$f" || { echo "missing $f"; exit 1; }
          done
      - name: GitHub release
        run: |
          notes="ARGUS desktop application (Windows and Linux), built from ${GITHUB_SHA::7} by the build workflow. Each archive passed the test suite, the web app smoke test and the packaged-application check on its own platform. The macOS archives (Intel and Apple silicon) are built on the team's Mac and published on the project site.

          Windows: extract, run ARGUS.exe (ARGUS-cli.exe for the command line). Linux: tar xzf, then ./ARGUS/ARGUS. The builds are not code-signed."
          if [ "$KIND" = release ]; then
            gh release create "$VERSION" out/* --repo "$GITHUB_REPOSITORY" --title "ARGUS $VERSION" --notes "$notes" --verify-tag
          else
            # the rolling pre-release always points at the newest main build
            gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
            gh release create latest out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "ARGUS latest build (main, ${GITHUB_SHA::7})" --notes "$notes"
          fi
      - uses: oras-project/setup-oras@v1
      - name: GitHub package (ghcr.io/<owner>/argus-desktop)
        run: |
          echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd out
          oras push "$PKG:${TAGS}" \
            --artifact-type application/vnd.argus.desktop.v1 \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.description=ARGUS desktop application: Windows x64 and Linux x64 archives" \
            --annotation "org.opencontainers.image.version=${VERSION}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            ARGUS-windows-x64.zip ARGUS-linux-x64.tar.gz

  # the web app as a Docker image on ghcr.io; started and checked before it is pushed
  publish-web:
    needs: [build, meta]
    if: needs.meta.outputs.kind != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ needs.meta.outputs.owner }}/argus-web
      TAGS: ${{ needs.meta.outputs.tags }}
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build for this runner and check it serves a run
        run: |
          docker buildx build --load -t argus-web:check .
          docker run -d --name argus -p 8095:8095 argus-web:check
          python3 - <<'PY'
          import json, time, urllib.request
          base = "http://127.0.0.1:8095"
          for _ in range(60):
              try:
                  if json.load(urllib.request.urlopen(base + "/api/health", timeout=5))["ok"]:
                      break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("container did not start")
          req = urllib.request.Request(base + "/api/run", data=json.dumps({"scenario": "clear_line", "overrides": {"duration_s": 3}, "speed": 0}).encode(),
                                       headers={"Content-Type": "application/json"})
          rid = json.load(urllib.request.urlopen(req, timeout=30))["run_id"]
          for _ in range(120):
              if json.load(urllib.request.urlopen(f"{base}/api/run/{rid}", timeout=10)).get("done"):
                  break
              time.sleep(1)
          else:
              raise SystemExit("run did not finish")
          pdf = urllib.request.urlopen(f"{base}/runs/{rid}/report", timeout=10).read()
          assert pdf.startswith(b"%PDF"), "report is not a PDF"
          print(f"container ok: run {rid}, report {len(pdf)} bytes")
          PY
      - name: Container log
        if: always()
        run: docker logs argus 2>&1 | tail -40 || true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push (linux/amd64 and linux/arm64)
        run: |
          args=()
          IFS=, read -ra t <<< "$TAGS"
          for x in "${t[@]}"; do args+=(-t "$IMAGE:$x"); done
          docker buildx build --push --platform linux/amd64,linux/arm64 "${args[@]}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.description=ARGUS web app: the desktop application's engine served to a browser" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" .
