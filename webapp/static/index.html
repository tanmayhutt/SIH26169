<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<title>ARGUS</title>
<meta name="description" content="ARGUS for SIH26169: the same program as the desktop application, running on the server.">
<style>
  /* Same palette, sizes and layout as the desktop application (fsoc_tracker/gui/theme.py). */
  :root { --ground:#0B1116; --surface:#111A21; --raised:#18242D; --sunken:#070C10; --ink:#E3ECF1; --ink2:#BCCCD5; --muted:#8DA1AD; --faint:#61737E;
          --line:#22323D; --line2:#1A2831; --accent:#52C4DE; --signal:#E08D4C; --good:#5CBE93; --bad:#E0603F;
          --ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
          --mono: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { color-scheme: dark; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--ui); font-size: 13px; display: flex; flex-direction: column; overflow: hidden; }
  /* toolbar */
  .tb { display: flex; align-items: center; gap: 4px; padding: 6px 8px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: nowrap; overflow-x: auto; }
  .tb .lab { color: var(--muted); padding: 0 2px 0 4px; white-space: nowrap; }
  .tb .sep { width: 1px; align-self: stretch; background: var(--line); margin: 5px 8px; }
  .tb .spacer { flex: 1; }
  .tb button { font: inherit; background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 5px 10px; color: var(--ink2); cursor: pointer; white-space: nowrap; }
  .tb button:hover:not(:disabled) { background: var(--raised); border-color: var(--line); color: var(--ink); }
  .tb button:disabled { color: var(--faint); cursor: default; }
  .tb button.primary { background: var(--accent); border-color: var(--accent); color: var(--ground); font-weight: 600; padding: 5px 16px; }
  .tb button.primary:hover:not(:disabled) { background: #6fd0e6; border-color: #6fd0e6; color: var(--ground); }
  .tb button.primary:disabled { background: var(--raised); border-color: var(--line); color: var(--faint); }
  .tb button.danger:not(:disabled) { color: var(--signal); border-color: #4a3322; }
  .tb button.dl { color: var(--good); border-color: rgba(92,190,147,.45); }
  select, input[type=number], input[type=text] { font: inherit; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; min-height: 26px; min-width: 0; }
  select:focus, input:focus { outline: none; border-color: var(--accent); }
  select:disabled, input:disabled { color: var(--faint); background: var(--ground); }
  input[type=checkbox] { accent-color: var(--accent); width: 14px; height: 14px; margin: 0; }
  /* main area */
  .main { flex: 1; display: flex; gap: 8px; padding: 8px; min-height: 0; }
  .side { width: 330px; flex: none; overflow-y: auto; padding: 0 10px 0 4px; }
  .sec { padding: 8px 0 12px; }
  .sec .h { font-weight: 600; padding: 4px 0 6px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
  .sec .h span { color: var(--faint); font-weight: 400; margin-left: 8px; }
  .sec .hint { color: var(--faint); padding: 2px 0 4px; }
  .row { display: grid; grid-template-columns: 140px 1fr; gap: 10px; align-items: center; margin: 6px 0; }
  .row > span { color: var(--muted); }
  .row.off > span { color: var(--faint); }
  .row input[type=number], .row input[type=text], .row select { width: 100%; }
  .row .chk { display: flex; align-items: center; gap: 8px; color: var(--ink2); }
  .centre { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; }
  .tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-width: 0; }
  .tile .t { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .v { font-size: 21px; font-weight: 600; margin: 1px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .u { color: var(--faint); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .v.pass { color: var(--good); } .v.fail, .v.warn { color: var(--signal); }
  .views { flex: 3; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; min-height: 0; }
  .view { position: relative; background: var(--sunken); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; min-height: 200px; }
  .view canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .view .idle { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--faint); text-align: center; padding: 20px; pointer-events: none; }
  .view.live .idle { display: none; }
  .plots { flex: 2; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 6px; min-height: 300px; }
  .plot { background: var(--surface); border-radius: 4px; position: relative; min-height: 140px; }
  .plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .tele { width: 250px; flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px; color: var(--ink2);
          font-family: var(--mono); font-size: 11px; white-space: pre-wrap; overflow: auto; line-height: 1.4; }
  /* status bar */
  .status { display: flex; align-items: center; gap: 12px; padding: 3px 10px; background: var(--surface); border-top: 1px solid var(--line); color: var(--muted); }
  .status .msg { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status .bar { width: 220px; height: 8px; border: 1px solid var(--line); border-radius: 3px; background: var(--ground); overflow: hidden; }
  .status .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 2px; }
  /* dialogs */
  dialog { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 0; width: min(640px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(3, 8, 12, .5); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
  dialog { box-shadow: 0 18px 48px rgba(0, 0, 0, .45); }
  .dlg { padding: 18px 20px 16px; }
  .dlg h2 { font-size: 17px; margin: 0 0 10px; font-weight: 600; }
  .dlg p { color: var(--muted); margin: 0 0 12px; line-height: 1.45; }
  .dlg pre { font-family: var(--mono); font-size: 12px; color: var(--ink); white-space: pre-wrap; margin: 0 0 14px; line-height: 1.4; }
  .dlg .foot { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; align-items: center; }
  .dlg .foot .left { margin-right: auto; }
  .dlg button, .dlg a.btn { font: inherit; background: var(--raised); border: 1px solid var(--line); border-radius: 4px; padding: 5px 14px; color: var(--ink); cursor: pointer; text-decoration: none; }
  .dlg button:hover, .dlg a.btn:hover { border-color: var(--accent); }
  .dlg a { color: var(--accent); }
  #dlg { box-sizing: border-box; width: 640px; max-width: calc(100% - 32px); }
  #dlg .choose { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  #dlg .opt { padding: 28px 24px 22px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  #dlg .opt + .opt { border-left: 1px solid var(--line); }
  #dlg .opt h2 { font-size: 17px; font-weight: 600; margin: 0; }
  #dlg .opt p { color: var(--muted); margin: 0 0 10px; }
  #dlg .cta { font: inherit; font-weight: 600; display: inline-block; padding: 9px 18px; border-radius: 4px; text-decoration: none; cursor: pointer;
              color: #07130E; background: var(--good); border: 1px solid var(--good); }
  #dlg .cta.ghost { color: var(--ink); background: transparent; border-color: var(--line); }
  #dlg .cta.ghost:hover { border-color: var(--accent); }
  #dlg .alt { font-size: 12px; color: var(--faint); margin-top: auto; padding-top: 10px; }
  #dlg .cta { display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; box-sizing: border-box; white-space: nowrap; }
  #dlg .os { flex: none; display: block; }
  #dlg #dl-alt { width: 100%; padding-top: 14px; }
  #dlg #dl-alt .k { font-size: 12px; color: var(--faint); margin-bottom: 8px; }
  #dlg #dl-alt .note { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  #dlg .osrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 8px; }
  #dlg .osbtn { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; border: 1px solid var(--line);
                border-radius: 4px; color: var(--ink2); text-decoration: none; font-size: 12px; text-align: center; line-height: 1.25; }
  #dlg .osbtn:hover { border-color: var(--accent); color: var(--ink); }
  #dlg .help { display: inline-flex; align-items: center; gap: 7px; margin-top: 12px; padding: 6px 12px; font-size: 13px; font-weight: 500;
               color: var(--accent); text-decoration: none; border: 1px solid var(--accent); border-radius: 4px; background: rgba(82, 196, 222, .08); }
  #dlg .help:hover { background: rgba(82, 196, 222, .16); }
  @media (max-width: 560px) { #dlg .choose { grid-template-columns: 1fr; } #dlg .opt + .opt { border-left: 0; border-top: 1px solid var(--line); } }
  @media (max-width: 1100px) { body { overflow: auto; } .main { flex-direction: column; } .side, .tele { width: auto; max-height: none; } .views { min-height: 420px; } }
</style>
</head>
<body>
<div class="tb">
  <span class="lab">Scenario</span><select id="scn" style="min-width:170px"></select>
  <div class="sep"></div>
  <button id="start" class="primary" title="Space">Start</button>
  <button id="pause" title="Space while running">Pause</button>
  <button id="step" title="N: advance one frame while paused">Step</button>
  <button id="stop" class="danger" title="Esc">Stop</button>
  <div class="sep"></div>
  <span class="lab">Speed</span><select id="speed"></select>
  <div class="sep"></div>
  <button id="open" title="Benchmark 2 (Ctrl+O): use a video file as the scene; the simulator is bypassed">Open video</button>
  <button id="sim" title="Leave video mode and use the simulated scene again">Simulator</button>
  <button id="truth">Truth CSV</button><input type="file" id="tfile" accept=".csv" style="display:none">
  <input type="file" id="file" accept=".mp4,.avi,.mov,.mkv" style="display:none">
  <div class="spacer"></div>
  <button id="save" title="Ctrl+S: save the current settings as a scenario file">Save scenario</button>
  <button id="shot" title="Ctrl+P: save a PNG of the views and plots">Screenshot</button>
  <button id="results" title="Runs on this server and their files">Results</button>
  <button id="manual" title="Open the user manual">Manual</button>
  <button id="about" title="What each view shows, and where the output goes">About</button>
  <button id="dl" class="dl" title="The standalone desktop application, the original deliverable">Desktop app</button>
</div>

<div class="main">
  <aside class="side" id="side"></aside>
  <div class="centre">
    <div class="tiles" id="tiles"></div>
    <div class="views">
      <div class="view" id="v-scene"><canvas id="scene"></canvas><div class="idle" id="scene-idle">The whole scene appears here when a run starts.</div></div>
      <div class="view" id="v-cam"><canvas id="cam"></canvas><div class="idle" id="cam-idle">The camera window appears here.</div></div>
    </div>
    <div class="plots">
      <div class="plot"><canvas id="p-err"></canvas></div>
      <div class="plot"><canvas id="p-cmd"></canvas></div>
      <div class="plot"><canvas id="p-proc"></canvas></div>
      <div class="plot"><canvas id="p-mode"></canvas></div>
    </div>
  </div>
  <div class="tele" id="tele"></div>
</div>
<div class="status"><span class="msg" id="status"></span><span class="bar"><i id="bar"></i></span></div>

<dialog id="d-msg"><div class="dlg"><h2 id="m-title"></h2><pre id="m-text"></pre><div class="foot" id="m-foot"></div></div></dialog>

<dialog id="dlg"><div class="choose">
  <section class="opt">
    <h2>Run in browser</h2>
    <p>Demo. Nothing to install.</p>
    <button class="cta ghost" id="dlg-close">Open demo</button>
    <label class="alt" id="dlg-remember"><input type="checkbox" id="dlg-skip"> don't show again</label>
  </section>
  <section class="opt">
    <h2>Run ARGUS on your system</h2>
    <p>Desktop app. Works offline.</p>
    <a class="cta" id="dl-main" href="/downloads/">Download</a>
    <div class="alt" id="dl-alt"></div>
    <a class="help" href="/downloads/USER_MANUAL.pdf" target="_blank"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg><span>Setup help</span></a>
  </section>
</div></dialog>

<script>
const $ = id => document.getElementById(id);
const COL = { accent: "#52C4DE", signal: "#E08D4C", good: "#5CBE93", muted: "#8DA1AD", faint: "#61737E", ink: "#E3ECF1", ink2: "#BCCCD5", line: "#22323D", surface: "#111A21" };
const MONO = getComputedStyle(document.documentElement).getPropertyValue("--mono");
const UI = getComputedStyle(document.documentElement).getPropertyValue("--ui");
let U = null, META = null, RUN_ID = null, WS = null, VIDEO = null, WATCHING = false, PAUSED = false, LAST = null, LIM = 5, TOTAL = 1;
let TARGETS = [], EDIT = 0, DESIG = 0, DMODE = "auto", CUE = "", PREVIEW = null, GEOM = null, CHECK_T = null, SIM_TARGETS = null;   // targets as stored (engine units); which one the form edits
let SEGMENT = 0, CHANGES = [], LIVE_TIMER = null, TOKEN = null;   // TOKEN: this page started the run and may control it   // disturbance changes during the run: segment seen, change times
const B = { t: [], terr: [], cerr: [], pan: [], tilt: [], proc: [], mode: [] };
const TRAIL = { truth: [], win: [], cam: [] };
const sceneImg = new Image(), camImg = new Image();

// ------------------------------------------------------------------ panel (built from the shared definition)
function fieldWidget(sec, f) {
  const id = sec + "." + f.name;
  if (f.kind === "bool") return `<label class="chk"><input type="checkbox" id="${id}"></label>`;
  if (f.kind === "choice" && f.editable) return `<input type="text" id="${id}" list="dl-${id}"><datalist id="dl-${id}">${f.choices.map(c => `<option value="${c}">`).join("")}</datalist>`;
  if (f.kind === "choice") return `<select id="${id}">${f.choices.map(c => `<option>${c}</option>`).join("")}</select>`;
  if (f.kind === "text") return `<input type="text" id="${id}">`;
  const step = f.kind === "int" ? 1 : f.step, dec = f.kind === "int" ? 0 : f.decimals;
  return `<input type="number" id="${id}" min="${f.min}" max="${f.max}" step="${step}" data-dec="${dec}"${f.scale ? ` data-scale="${f.scale}"` : ""}>`;
}
function buildPanel() {
  const esc = s => String(s).replace(/"/g, "&quot;");
  let h = `<div class="sec"><div class="h">Run</div>
    <div class="row"><span>Name</span><input type="text" id="name"></div>
    <div class="row"><span title="Same seed and settings give exactly the same run.">Seed</span><input type="number" id="seed" min="0" max="1000000" step="1"></div>
    <div class="row"><span></span><label class="chk" title="On: each Start draws a new seed and a new heading for line paths, so every run is different. Off: the seed shown is used, so a run can be repeated exactly."><input type="checkbox" id="rnd" checked> New seed each run</label></div>
    <div class="row" id="row-duration"><span>Duration (s)</span><input type="number" id="duration" min="${U.duration_range[0]}" max="${U.duration_range[1]}" step="1"></div>
    <div class="row" id="row-extra"><span title="${esc(U.run_tips.extra)}">Extra targets</span><input type="number" id="extra" min="0" max="${U.extra_max}" step="1"></div>
    <div class="row" id="row-identical"><span></span><label class="chk" title="${esc(U.run_tips.identical)}"><input type="checkbox" id="identical"> Identical look</label></div>
    <div class="row" id="row-beacon" title="${esc(U.run_tips.beacon)}" hidden><span>Beacon</span><select id="beacon"></select></div>
    <div class="hint" id="check" title="Scenario check: values beyond the problem statement, values the camera cannot physically follow, and values that were corrected."></div></div>`;
  for (const s of U.sections) {
    h += `<div class="sec" id="sec-${s.key}"><div class="h">${s.title}${s.ref ? `<span>${s.ref}</span>` : ""}</div>${s.hint ? `<div class="hint">${s.hint}</div>` : ""}`;
    if (s.key === "target") h += `<div class="row" id="row-edit" title="${esc(U.run_tips.edit)}"><span>Target</span><select id="edit"></select></div>
      <div class="row" id="row-desig"><span></span><label class="chk" title="${esc(U.run_tips.designated)}"><input type="checkbox" id="desig"> Designated</label></div>`;
    for (const f of s.fields) h += `<div class="row" id="row-${s.key}.${f.name}" title="${esc(f.tip)}"><span>${f.label}</span>${fieldWidget(s.key, f)}</div>`;
    h += `</div>`;
  }
  $("side").innerHTML = h;
  $("disturbance.atmosphere").addEventListener("change", e => { const p = U.presets[e.target.value]; if (p) for (const k in p) { const el = $("disturbance." + k); if (el) el.value = fmtNum(el, p[k]); } });
  for (const key of U.live_sections) for (const f of U.sections.find(x => x.key === key).fields) {
    const el = $(key + "." + f.name); el.addEventListener("change", liveEdited); if (f.kind !== "choice" && f.kind !== "bool") el.addEventListener("input", liveEdited);
  }
  $("side").addEventListener("input", scheduleCheck); $("side").addEventListener("change", scheduleCheck);
  $("edit").addEventListener("change", () => { saveTargetForm(); EDIT = $("edit").selectedIndex; loadTargetForm(EDIT); syncDesigBox(); });
  $("desig").addEventListener("click", () => { DESIG = EDIT; refreshTargetLists(); setStatus("Designated " + nameOf(TARGETS[DESIG], DESIG) + ": the tracker follows it and the report scores it.");
    if (VIDEO) { applyVideoDesignation(); showVideoPreview(VIDEO); } else if (PREVIEW) drawPreview(); });
  $("target.name").addEventListener("input", () => { saveTargetForm(); refreshTargetLists(); });
  // the Beacon picker of the Run section: the chosen video beacon is the designated target
  $("beacon").addEventListener("change", () => { if (RUN_ID || !VIDEO || !(VIDEO.beacons || []).length) return; EDIT = DESIG = $("beacon").selectedIndex; loadTargetForm(EDIT); refreshTargetLists(DESIG); applyVideoDesignation(); showVideoPreview(VIDEO); scheduleCheck(); });
}
function refreshBeaconList() {
  const vb = VIDEO ? (VIDEO.beacons || []) : [], labels = vb.length ? (VIDEO.beacon_labels || vb.map((b, i) => `Target ${i + 1}`)) : ["none found"];
  $("beacon").innerHTML = labels.map(l => `<option>${l.replace(/</g, "&lt;")}</option>`).join(""); $("beacon").selectedIndex = Math.min(DESIG, Math.max(vb.length - 1, 0));
  $("beacon").disabled = !vb.length; $("row-beacon").title = vb.length ? U.run_tips.beacon : U.run_tips.beacon_none; $("row-beacon").hidden = !VIDEO;
}
const tsec = () => U.sections.find(x => x.key === "target");
const nameOf = (t, i) => (t.name || "").trim() || `Target ${i + 1}`;
function readField(el, f) { if (f.kind === "bool") return el.checked; if (f.kind === "int" || f.kind === "float") { const k = Number(el.dataset.scale || 1); return Number(el.value) / k; } return el.value.trim(); }
function writeField(el, f, v) { if (f.kind === "bool") el.checked = !!v; else if (f.kind === "int" || f.kind === "float") el.value = fmtNum(el, Number(v) * Number(el.dataset.scale || 1)); else el.value = v ?? ""; }
function saveTargetForm() { const t = TARGETS[EDIT]; if (!t) return; for (const f of tsec().fields) { const el = $("target." + f.name); if (el) t[f.name] = readField(el, f); } }
function loadTargetForm(i) { const t = TARGETS[i]; if (!t) return; for (const f of tsec().fields) { const el = $("target." + f.name); if (el && f.name in t) writeField(el, f, t[f.name]); } }
function refreshTargetLists(di) {
  if (di !== undefined) DESIG = di;
  const names = TARGETS.map(nameOf); DESIG = Math.min(Math.max(DESIG, 0), names.length - 1); EDIT = Math.min(Math.max(EDIT, 0), names.length - 1);
  $("edit").innerHTML = names.map((n, i) => `<option>${i === DESIG ? "* " : ""}${n.replace(/</g, "&lt;")}</option>`).join(""); $("edit").selectedIndex = EDIT;
  syncDesigBox();
}
// one target is always designated, so the box cannot be unticked: tick it on another target instead
function syncDesigBox() { const on = EDIT === DESIG; $("desig").checked = on; $("desig").disabled = on; }
// a video's designated target is a detected beacon: the tracker is cued to its measured centre
function applyVideoDesignation() { if (!VIDEO || !VIDEO.beacons || !VIDEO.beacons.length) return; const b = VIDEO.beacons[Math.min(DESIG, VIDEO.beacons.length - 1)];
  CUE = `${Math.round(b.x)},${Math.round(b.y)}`; setStatus(`Designated ${nameOf(TARGETS[DESIG], DESIG)} at ${Math.round(b.x)},${Math.round(b.y)} (${Math.round(b.w)} x ${Math.round(b.h)} px, peak ${Math.round(b.peak)}): the tracker follows it and the report scores it. Choose another beacon in the Run section.`); }
function scheduleCheck() { if (RUN_ID) return; clearTimeout(CHECK_T); CHECK_T = setTimeout(runCheck, 300); }
async function runCheck() {
  if (RUN_ID) return;
  let j; try { const r = await fetch("api/check", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ scenario: $("scn").value || null, overrides: readForm(), video: VIDEO ? VIDEO.upload : null }) }); if (!r.ok) return; j = await r.json(); } catch (e) { return; }
  if (RUN_ID) return;
  const c = $("check"); c.textContent = j.lines.length ? j.lines.join("\n") : "Scenario check: all values inside the PS envelope."; c.style.color = j.lines.length ? COL.signal : COL.faint; c.style.whiteSpace = "pre-wrap";
  if (j.targets && j.targets.length !== TARGETS.length) { TARGETS = j.targets; EDIT = Math.min(EDIT, TARGETS.length - 1); refreshTargetLists(j.designated); }
  if (!VIDEO && j.preview) { PREVIEW = j; LAST = null; sceneImg.onload = drawPreview; sceneImg.src = "data:image/jpeg;base64," + j.preview; }
  else if (VIDEO) showVideoPreview(VIDEO);
}
function drawBeacons(x, beacons, names, di, s) {

  scheduleCheck();
  const mh = location.hash.match(/run=([\w-]+)/);
  if (mh) { attach(mh[1]); return; }
  try { const h = await (await fetch("api/health")).json(); if (h.busy) { attach(h.busy); setStatus("Another run is in progress (" + (h.busy_name || h.busy) + "); watching it. Start becomes available when it ends."); return; } } catch (e) {}
  let skip = false; try { skip = localStorage.getItem("fsoc.skipWelcome") === "1"; } catch (e) {}
  if (!skip) setTimeout(() => openDownloads(true), 400);
}
init();
</script>
</body>
