# Template for an evaluator-supplied scenario (Benchmark Performance 1).
# Copy this file, fill the values the evaluators give you, save it under configs/scenarios/,
# and it appears in the Scenario picker of the desktop and web applications. Every field is
# labelled with the problem statement (PS) row it implements; fields not given by the
# evaluators can stay at the PS default shown here.
#
#   fsoc-tracker run -s configs/scenarios/evaluator_case1.yaml --duration 30
#
name: evaluator_case1          # appears in the report header and the results folder name
seed: 0                        # any integer; the same seed reproduces the same run exactly
duration_s: 30                 # seconds; the GUI and web app can also stop a run early

screen:                        # PS rows 1 and 2
  width: 2000                  # row 1, screen size in px (min 2000 x 2000)
  height: 2000
  colour: false                # row 2, monochrome FPA (false) or colour (true)
  background: starfield        # starfield | terrain | gradient | flat
  background_level: 12         # sky level 0 to 255

camera:                        # PS rows 3 to 6 and 13 to 15
  width: 640                   # row 3, camera resolution in px
  height: 480
  fov_w_deg: 4.0               # row 4, FOV in degrees (default 4 x 3)
  fov_h_deg: 3.0
  update_rate_hz: 30           # row 5, camera update rate (min 30 Hz)
  max_pan_rate_deg_s: 5        # row 13, 5 to 10 deg/s
  max_tilt_rate_deg_s: 5       # row 14, 5 to 10 deg/s
  window_only: false           # hard mode: the tracker sees only the camera window
                               # row 6 (initial camera position, centre) is fixed; row 15 (>= 20 Hz commands) follows the update rate

targets:                       # PS rows 7 to 12; the first entry is the designated beacon, more entries are decoys (row 8)
  - shape: square              # row 9: square | circle | gaussian (default square)
    size_px: 10                # row 10: 5 to 20 px (default 10)
    intensity: 235             # peak grey level 0 to 255
    motion: line               # row 12: line | circular | figure8 | random | spiral | sinusoidal | waypoints | static
    speed_px_s: 120            # along-track speed for line, random, sinusoidal, waypoints
    radius_px: 400             # circular, figure8, spiral
    period_s: 12               # circular, figure8, sinusoidal
    start: random              # row 11: random | centre | "x,y" in screen px
    heading_deg: 30            # line and sinusoidal direction
    waypoints: ""              # user-defined path for motion waypoints, e.g. "300,300; 1700,400; 1000,1600"

disturbance:                   # PS rows 21 to 25; all off at the defaults below
  salt_pepper_frac: 0.0        # row 21, fraction of pixels (0.10 = about 10 percent)
  gaussian_sigma: 0.0          # row 21 and 22, standard deviation in grey levels (max 20 suggested)
  poisson: false               # row 21, shot noise
  jitter_px: 0.0               # row 23, camera jitter, +/- px per frame (max 20 suggested)
  atmosphere: clear            # row 24: clear | haze | fog | rain | lowlight
  contrast: 1.0                # row 24, user-defined contrast reduction (1.0 = none); overrides the preset when set
  brightness: 0.0              # row 24, user-defined brightness offset in grey levels
  platform_motion: none        # row 25: none | linear | circular | random | spiral | figure8
  platform_px_frame: 0.0       # row 25, platform speed in px per frame (max 20 suggested)
  platform_period_s: 20        # period of the platform sway pattern

# Benchmark Performance 2 (a video file replaces the simulator) needs no scenario file:
#   fsoc-tracker video path/to/their_file.mp4
# or drop the file on the web app or use "Open video" in the desktop application. The screen
# size and frame rate are read from the file; the camera and rate-limit fields above still apply
# if you pass this file with -s.
